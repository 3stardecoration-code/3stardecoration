name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run tests/env.test.ts tests/tokens.test.ts tests/reduced-motion.test.ts tests/cloudinary-loader.test.ts tests/report-error.test.ts tests/smoke.test.ts
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://not-configured.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: not-configured
          SUPABASE_SERVICE_ROLE_KEY: not-configured
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: placeholder
          CLOUDINARY_API_KEY: placeholder
          CLOUDINARY_API_SECRET: placeholder
          NEXT_PUBLIC_SITE_URL: https://www.3stardecoration.in

